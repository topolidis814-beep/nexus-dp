<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXUS — Marketplace B2B</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f5f7fa;font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:#07111ff2;border-bottom:1px solid #203a55}.topin{min-height:66px;display:flex;align-items:center;gap:12px}
.brand{font-weight:900;letter-spacing:.15em}.brand b,.price{color:#39d5a5}.search{flex:1}
.search input,.field input,.field select,.field textarea,.filters input,.filters select{width:100%;padding:12px;border-radius:11px;border:1px solid #294866;background:#0b1929;color:white}
.btn{border:0;border-radius:11px;padding:11px 14px;background:#39d5a5;color:#052116;font-weight:800;cursor:pointer}.btn.alt{background:#14283d;color:white}.btn.danger{background:#642536;color:white}
.hero{padding:34px 0 16px}.hero h1{font-size:clamp(36px,7vw,62px);line-height:1;margin:0 0 12px}.muted,.small{color:#9fb0c5}.small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.box{background:#0e1d2e;border:1px solid #203a55;border-radius:17px;overflow:hidden}.card{cursor:pointer}
.photo{aspect-ratio:4/3;background:#102238;display:flex;align-items:center;justify-content:center;color:#71859a}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:13px}
.company{font-size:11px;color:#9fb0c5;text-transform:uppercase}.title{font-size:16px;font-weight:800;margin:6px 0}.price{font-size:21px;font-weight:900}.meta{font-size:12px;color:#9fb0c5;margin-top:6px}
.empty{grid-column:1/-1;padding:38px;text-align:center;color:#9fb0c5}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:10px 0 18px}
.panel,.modal{position:fixed;inset:0;z-index:70;background:#07111f;display:none;overflow:auto;padding-bottom:90px}.panel.on,.modal.on{display:block}.head{position:sticky;top:0;z-index:2;background:#07111ff2;border-bottom:1px solid #203a55;padding:12px 16px}
.sheet{max-width:760px;margin:20px auto;padding:16px}.box{padding:15px;margin-bottom:12px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#9fb0c5;margin-bottom:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:20px;margin-top:8px;color:#39d5a5}.bottom{display:none}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#163126;color:#6ee7b7;font-size:10px;font-weight:800;margin-top:6px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.topin{flex-wrap:wrap;padding:9px 0}.brand{width:100%}.grid{gap:8px}.filters,.row{grid-template-columns:1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:50;background:#0a1726f7;border-top:1px solid #203a55;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;color:#b5c3d1;font-size:10px}.spacer{height:78px}}
</style></head><body>
<header class="top"><div class="wrap topin"><div class="brand">NE<b>X</b>US</div><div class="search"><input id="q" placeholder="Cerca stock, materiali, macchinari…"></div><button class="btn" id="publish">+ Pubblica</button></div></header>
<main class="wrap"><section class="hero"><h1>Stock fermo.<br>Nuove opportunità.</h1><p class="muted">Marketplace professionale B2B per eccedenze, fine serie, materiali e attrezzature.</p></section>
<div class="bar"><h2>Marketplace</h2><button class="btn alt" id="account">Accesso</button></div>
<div class="filters"><select id="category"><option value="">Tutte le categorie</option></select><input id="location" placeholder="Località"><select id="sort"><option value="new">Più recenti</option><option value="low">Prezzo crescente</option><option value="high">Prezzo decrescente</option></select></div>
<section class="grid" id="grid"><div class="empty">Caricamento…</div></section><div class="spacer"></div></main>
<nav class="bottom"><button id="homeNav">⌂<br>Home</button><button id="catNav">▦<br>Categorie</button><button id="pubNav">＋<br>Pubblica</button><button id="offersNav">↔<br>Offerte</button><button id="txNav">✓<br>Transazioni</button></nav>
<section class="panel" id="authPanel"><div class="head"><button class="btn alt close">← Marketplace</button> <b>Account NEXUS</b></div><div class="sheet">
<div class="box"><h2>Accesso</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><div class="actions"><button class="btn" id="login">Accedi</button><button class="btn alt" id="signup">Registrati</button><button class="btn danger" id="logout" style="display:none">Esci</button></div><div class="status" id="authStatus"></div></div>
<div class="box" id="companyBox" style="display:none"><h3>Azienda</h3><div class="field"><label>Ragione sociale</label><input id="companyName"></div><div class="field"><label>Partita IVA</label><input id="vat"></div><button class="btn" id="createCompany">Crea azienda</button><div class="status" id="companyStatus"></div></div></div></section>
<section class="panel" id="publishPanel"><div class="head"><button class="btn alt close">← Marketplace</button> <b>Pubblica annuncio</b></div><div class="sheet"><div class="box">
<div class="field"><label>Titolo</label><input id="pTitle"></div><div class="row"><div class="field"><label>Categoria</label><input id="pCategory"></div><div class="field"><label>Località</label><input id="pLocation"></div></div><div class="field"><label>Descrizione</label><textarea id="pDescription" rows="4"></textarea></div>
<div class="row"><div class="field"><label>Quantità</label><input id="pQty" type="number" min="1" value="1"></div><div class="field"><label>Quantità minima</label><input id="pMin" type="number" min="1" value="1"></div></div>
<div class="row"><div class="field"><label>Prezzo unitario €</label><input id="pPrice" type="number" min=".01" step=".01"></div><div class="field"><label>Prezzo lotto €</label><input id="pLot" type="number" min=".01" step=".01"></div></div>
<div class="field"><label><input id="pQuick" type="checkbox"> Liquidazione rapida</label></div><div class="field"><label>Foto</label><input id="pPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple></div>
<button class="btn" id="createListing">Pubblica</button><div class="status" id="publishStatus"></div></div></div></section>
<section class="modal" id="productPanel"><div class="head"><button class="btn alt close">← Marketplace</button> <b>Prodotto</b></div><div class="sheet" id="productContent"></div></section>
<section class="panel" id="offersPanel"><div class="head"><button class="btn alt close">← Marketplace</button> <b>Offerte</b></div><div class="sheet" id="offersList"></div></section>
<section class="panel" id="txPanel"><div class="head"><button class="btn alt close">← Marketplace</button> <b>Transazioni</b></div><div class="sheet" id="txList"></div></section>
<script>
const U='https://dneascaddmtauntlimpi.supabase.co',K='sb_publishable_4vVAwKpUYS3y3__Z4I7HgA_qnL-TEZn',db=supabase.createClient(U,K),$=id=>document.getElementById(id);
let rows=[],selected=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
function closeAll(){document.querySelectorAll('.panel,.modal').forEach(x=>x.classList.remove('on'))}function open(id){closeAll();$(id).classList.add('on')}document.querySelectorAll('.close').forEach(b=>b.onclick=closeAll);
async function user(){return(await db.auth.getUser()).data.user}async function companyId(){const{data,error}=await db.rpc('my_company_id');if(error)throw error;return data}
async function refreshSession(){const u=await user();$('logout').style.display=u?'inline-block':'none';$('login').style.display=u?'none':'inline-block';$('signup').style.display=u?'none':'inline-block';$('authStatus').textContent=u?'Connesso: '+u.email:'Non connesso';if(u){let cid=null;try{cid=await companyId()}catch{}$('companyBox').style.display=cid?'none':'block'}else $('companyBox').style.display='none'}
$('account').onclick=()=>open('authPanel');$('publish').onclick=$('pubNav').onclick=openPublish;$('offersNav').onclick=loadOffers;$('txNav').onclick=loadTx;$('homeNav').onclick=()=>{closeAll();scrollTo(0,0)};$('catNav').onclick=()=>$('category').scrollIntoView({behavior:'smooth'});
$('login').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('authStatus').textContent=error?'Errore: '+error.message:'Accesso eseguito.';await refreshSession();if(!error)load()};
$('signup').onclick=async()=>{const{error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});$('authStatus').textContent=error?'Errore: '+error.message:'Registrazione effettuata.';await refreshSession()};
$('logout').onclick=async()=>{await db.auth.signOut();await refreshSession();closeAll()};
$('createCompany').onclick=async()=>{const{error}=await db.rpc('create_company_and_join',{p_name:$('companyName').value.trim(),p_vat:$('vat').value.trim(),p_country:'IT'});$('companyStatus').textContent=error?'Errore: '+error.message:'Azienda creata.';if(!error)refreshSession()};
async function load(){const{data,error}=await db.rpc('marketplace_feed',{p_limit:50,p_offset:0});if(error){$('grid').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}rows=data||[];const cs=[...new Set(rows.map(x=>x.category_name).filter(Boolean))].sort();$('category').innerHTML='<option value="">Tutte le categorie</option>'+cs.map(x=>`<option>${esc(x)}</option>`).join('');render()}
function imageUrl(path){return path?db.storage.from('listing-images').getPublicUrl(path).data.publicUrl:''}
function render(){let a=[...rows],q=$('q').value.trim().toLowerCase(),c=$('category').value,loc=$('location').value.trim().toLowerCase();if(q)a=a.filter(x=>[x.title,x.description,x.category_name,x.company_name,x.location].some(v=>String(v||'').toLowerCase().includes(q)));if(c)a=a.filter(x=>x.category_name===c);if(loc)a=a.filter(x=>String(x.location||'').toLowerCase().includes(loc));if($('sort').value==='low')a.sort((x,y)=>+x.unit_price-+y.unit_price);if($('sort').value==='high')a.sort((x,y)=>+y.unit_price-+x.unit_price);$('grid').innerHTML=a.length?a.map(x=>`<article class="card" data-id="${x.id}"><div class="photo">${x.image_path?`<img src="${esc(imageUrl(x.image_path))}">`:'FOTO PRODOTTO'}</div><div class="body"><div class="company">${esc(x.company_name||'Azienda')}</div><div class="title">${esc(x.title)}</div><div class="price">€ ${money(x.unit_price)}</div><div class="meta">${esc(x.quantity)} ${esc(x.unit||'pz')} · ${esc(x.location||'')}</div>${x.liquidate_fast?'<span class="badge">LIQUIDAZIONE</span>':''}</div></article>`).join(''):'<div class="empty">Nessun annuncio attivo.</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>showProduct(x.dataset.id))}
$('q').oninput=render;$('category').onchange=render;$('location').oninput=render;$('sort').onchange=render;
async function openPublish(){if(!await user()){open('authPanel');$('authStatus').textContent='Accedi prima di pubblicare.';return}if(!await companyId()){open('authPanel');$('companyBox').style.display='block';return}open('publishPanel')}
$('createListing').onclick=async()=>{try{$('publishStatus').textContent='Pubblicazione…';const qty=+$('pQty').value,min=+$('pMin').value,price=+$('pPrice').value,lot=$('pLot').value?+$('pLot').value:null;
const{data,error}=await db.rpc('create_listing',{p_title:$('pTitle').value.trim(),p_quantity:qty,p_unit:'pz',p_unit_price:price,p_description:$('pDescription').value.trim()||null,p_category:$('pCategory').value.trim()||null,p_condition:'Nuovo',p_location:$('pLocation').value.trim()||null,p_ships:true,p_min_qty:min,p_accepts_offers:true,p_liquidate_fast:$('pQuick').checked,p_full_lot_price:lot});if(error)throw error;
const listing=Array.isArray(data)?data[0]:data,lid=listing?.id||data;const cid=await companyId(),files=[...$('pPhotos').files];for(let i=0;i<files.length;i++){const f=files[i];if(f.size>5242880)throw Error('Foto oltre 5 MB');const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=`${cid}/${lid}/${crypto.randomUUID()}.${ext}`;const{error:ue}=await db.storage.from('listing-images').upload(path,f,{contentType:f.type});if(ue)throw ue;const{error:ie}=await db.from('product_images').insert({listing_id:lid,storage_path:path,sort_order:i,is_primary:i===0,alt_text:null});if(ie)throw ie}$('publishStatus').textContent='Annuncio pubblicato.';await load();setTimeout(closeAll,500)}catch(e){$('publishStatus').textContent='Errore: '+e.message}};
function showProduct(id){selected=rows.find(x=>String(x.id)===String(id));if(!selected)return;const im=imageUrl(selected.image_path);$('productContent').innerHTML=`<div class="box">${im?`<img src="${esc(im)}" style="width:100%;max-height:420px;object-fit:contain;border-radius:12px">`:''}<div class="company">${esc(selected.company_name||'Azienda')}</div><h2>${esc(selected.title)}</h2><div class="price">€ ${money(selected.unit_price)}</div><p>${esc(selected.description||'')}</p><div class="row"><div class="field"><label>Quantità</label><input id="oQty" type="number" value="${selected.min_qty||1}"></div><div class="field"><label>Prezzo proposto €</label><input id="oPrice" type="number" step=".01" value="${selected.unit_price}"></div></div><div class="field"><label>Messaggio</label><textarea id="oMessage"></textarea></div><button class="btn" id="sendOffer">Invia offerta</button><div id="offerStatus" class="status"></div></div>`;open('productPanel');$('sendOffer').onclick=sendOffer}
async function sendOffer(){if(!await user()){open('authPanel');return}const{error}=await db.rpc('create_offer',{p_listing_id:selected.id,p_quantity:+$('oQty').value,p_price:+$('oPrice').value,p_message:$('oMessage').value.trim()||null});$('offerStatus').textContent=error?'Errore: '+error.message:'Offerta inviata.'}
async function loadOffers(){if(!await user()){open('authPanel');return}open('offersPanel');const{data,error}=await db.rpc('offer_inbox',{p_side:'all',p_status:null,p_limit:50,p_offset:0});if(error){$('offersList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const os=data||[];$('offersList').innerHTML=os.length?os.map(o=>`<div class="box"><b>Offerta</b><div class="meta">${esc(o.status)} · quantità ${o.quantity} · € ${money(o.price)}</div>${['pending','countered'].includes(o.status)?`<div class="actions"><button class="btn" data-a="${o.id}">Accetta</button><button class="btn danger" data-r="${o.id}">Rifiuta</button><button class="btn alt" data-c="${o.id}" data-q="${o.quantity}" data-p="${o.price}">Controfferta</button></div>`:''}</div>`).join(''):'<div class="empty">Nessuna offerta.</div>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const{error}=await db.rpc('accept_offer_atomic',{p_offer_id:b.dataset.a});if(error)alert(error.message);await loadOffers();await load()});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{const{error}=await db.rpc('reject_offer',{p_offer_id:b.dataset.r});if(error)alert(error.message);await loadOffers()});document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{const q=prompt('Nuova quantità',b.dataset.q);if(q===null)return;const p=prompt('Nuovo prezzo',b.dataset.p);if(p===null)return;const m=prompt('Messaggio','');const{error}=await db.rpc('counter_offer',{p_offer_id:b.dataset.c,p_quantity:+q,p_price:+p,p_message:m||null});if(error)alert(error.message);await loadOffers()})}
async function loadTx(){if(!await user()){open('authPanel');return}open('txPanel');const{data,error}=await db.rpc('my_transactions',{p_limit:50,p_offset:0});if(error){$('txList').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}const ts=data||[];$('txList').innerHTML=ts.length?ts.map(t=>`<div class="box"><b>Transazione</b><div class="meta">${esc(t.status)} · quantità ${t.quantity}</div><div class="price">€ ${money(Number(t.price)*Number(t.quantity))}</div><div class="small">${new Date(t.created_at).toLocaleString('it-IT')}</div></div>`).join(''):'<div class="empty">Nessuna transazione.</div>'}
db.auth.onAuthStateChange(refreshSession);refreshSession();load();
</script></body></html>
