<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="NEXUS - Marketplace B2B per stock, eccedenze e rimanenze aziendali.">
<title>NEXUS | Marketplace B2B</title>

<style>
:root{
  --bg:#07111f;--panel:#0d1b2a;--panel2:#12243a;
  --text:#f4f7fb;--muted:#9fb0c5;--accent:#34d399;
  --line:#20364f;--danger:#fb7185
}
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:#07111f;color:var(--text)
}
.wrap{max-width:1100px;margin:auto;padding:20px}
header{border-bottom:1px solid var(--line);background:#07111f}
nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{font-size:25px;font-weight:900;letter-spacing:2px}
.brand span{color:var(--accent)}
.row{display:flex;gap:9px;flex-wrap:wrap}
.card{
  background:linear-gradient(145deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0
}
button,input,textarea,select{
  padding:12px;border-radius:9px;border:1px solid var(--line);
  background:#07111f;color:white;font:inherit
}
button{background:var(--accent);color:#052015;font-weight:800;cursor:pointer}
button.secondary{background:#12243a;color:white}
input{min-width:180px}
textarea{width:100%;min-height:100px}
.muted{color:var(--muted)}
.ok{color:var(--accent)}
.bad{color:var(--danger)}
.price{color:var(--accent);font-size:20px;font-weight:900}
.hero{padding:45px 0 20px}
h1{font-size:clamp(42px,7vw,68px);line-height:1;margin:10px 0}
.tabs{margin:20px 0}
.listing{border-bottom:1px solid var(--line);padding:15px 0}
.modal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
  z-index:20;align-items:center;justify-content:center;padding:20px
}
.modal.open{display:flex}
.modal>.card{width:min(600px,100%);max-height:90vh;overflow:auto}
.close{float:right;cursor:pointer;color:var(--muted);font-size:22px}
@media(max-width:700px){
  nav{align-items:flex-start;padding:14px 0;flex-direction:column}
  input{width:100%}
  .row button{flex-grow:1}
}
</style>
</head>

<body>

<header>
<div class="wrap">
<nav>
  <div class="brand">NEXUS<span>•</span></div>
  <div class="row">
    <button class="secondary" onclick="openModal('accesso')">Accedi</button>
    <button onclick="publishForm()">Pubblica merce</button>
  </div>
</nav>
</div>
</header>

<main class="wrap">

<section class="hero">
  <div class="muted">MARKETPLACE B2B ITALIANO</div>
  <h1>Trasforma lo stock fermo in liquidità.</h1>
  <p class="muted">
    NEXUS mette in contatto aziende con eccedenze, rimanenze,
    fine serie e attrezzature con aziende alla ricerca di opportunità.
  </p>
</section>

<section class="card">
  <b>Account NEXUS</b>
  <p id="authStatus" class="muted">Controllo sessione...</p>

  <div class="row">
    <button class="secondary" onclick="openModal('accesso')">Accedi / Registrati</button>
    <button onclick="publishForm()">Pubblica merce</button>
  </div>
</section>

<div class="row tabs">
  <button onclick="market()">Marketplace</button>
  <button class="secondary" onclick="myListings()">I miei annunci</button>
  <button class="secondary" onclick="offers()">Offerte</button>
  <button class="secondary" onclick="transactions()">Transazioni</button>
</div>

<p id="msg" class="muted"></p>
<div id="out"></div>

</main>


<!-- ACCESSO -->
<div class="modal" id="accesso">
<div class="card">

<span class="close" onclick="closeModal('accesso')">✕</span>

<h2>Account NEXUS</h2>

<label>Email</label>
<input id="email" type="email" placeholder="azienda@esempio.it">

<label>Password</label>
<input id="password" type="password" placeholder="Minimo 6 caratteri">

<div class="row">
  <button onclick="signup()">Registrati</button>
  <button class="secondary" onclick="login()">Accedi</button>
  <button class="secondary" onclick="logout()">Esci</button>
</div>

<p id="authMessage" class="muted"></p>

</div>
</div>


<!-- PUBBLICAZIONE -->
<div class="modal" id="pubblica">
<div class="card">

<span class="close" onclick="closeModal('pubblica')">✕</span>

<h2>Pubblica merce</h2>

<label>Nome ditta</label>
<input id="companyName" placeholder="Nome azienda">

<label>Partita IVA / identificativo fiscale</label>
<input id="vat" placeholder="Partita IVA">

<label>Titolo</label>
<input id="title" placeholder="Titolo del lotto">

<label>Categoria</label>
<input id="category" placeholder="Stock / rimanenze">

<label>Quantità</label>
<input id="quantity" type="number" min="0.01" step="0.01" placeholder="Quantità">

<label>Unità</label>
<input id="unit" placeholder="pz, kg, pallet...">

<label>Prezzo unitario €</label>
<input id="price" type="number" min="0" step="0.01" placeholder="100">

<label>Località</label>
<input id="location" placeholder="Milano">

<label>Descrizione</label>
<textarea id="description" placeholder="Descrizione della merce"></textarea>

<button onclick="publishListing()">Pubblica nel marketplace</button>

<p id="publishMessage" class="muted"></p>

</div>
</div>


<script type="module">

import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://dneascaddmtauntlimpi.supabase.co',
  'sb_publishable_4vVAwKpUYS3y3__Z4I7HgA_qnL-TEZn'
);

const $ = id => document.getElementById(id);

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

window.openModal = function(id){
  $(id).classList.add('open');
};

window.closeModal = function(id){
  $(id).classList.remove('open');
};

async function currentUser(){
  const {data} = await supabase.auth.getUser();
  return data.user || null;
}

async function refreshAuth(){

  const user = await currentUser();

  $('authStatus').textContent =
    user ? 'Connesso: ' + user.email : 'Non autenticato';

  return user;
}


/* =========================
   REGISTRAZIONE
========================= */

window.signup = async function(){

  const email = $('email').value.trim();
  const password = $('password').value;

  if(!email || password.length < 6){
    $('authMessage').textContent =
      'Inserisci email e password di almeno 6 caratteri.';
    return;
  }

  const {data,error} = await supabase.auth.signUp({
    email,
    password,
    options:{
      emailRedirectTo:location.origin
    }
  });

  if(error){
    $('authMessage').textContent = 'Errore: ' + error.message;
    return;
  }

  if(data.session){
    $('authMessage').textContent = 'Registrazione completata.';
  }else{
    $('authMessage').textContent =
      'Registrazione effettuata. Se richiesto, conferma l’email e poi accedi.';
  }

  await refreshAuth();
};

========================= */
